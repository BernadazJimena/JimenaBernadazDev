<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t">
  <title id="t">Tres opciones lado a lado: una landing, una web y una tienda online</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e8fb"/>
      <stop offset="1" stop-color="#d6c4f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6dff"/>
      <stop offset="1" stop-color="#5d31b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5d31b8" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="260" fill="#c7b0f3" opacity=".45"/>
  <circle cx="120" cy="930" r="220" fill="#e6d9fa" opacity=".8"/>

  <g font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">

    <!-- Landing: una sola página larga -->
    <g filter="url(#shadow)">
      <rect x="160" y="190" width="360" height="560" rx="30" fill="#f8f2fd"/>
    </g>
    <rect x="160" y="190" width="360" height="56" rx="30" fill="#eadff6"/>
    <rect x="160" y="218" width="360" height="28" fill="#eadff6"/>
    <circle cx="198" cy="218" r="8" fill="#c9b2de"/><circle cx="224" cy="218" r="8" fill="#c9b2de"/><circle cx="250" cy="218" r="8" fill="#c9b2de"/>
    <rect x="200" y="290" width="200" height="22" rx="11" fill="#24185a"/>
    <rect x="200" y="328" width="280" height="14" rx="7" fill="#c9b2de"/>
    <rect x="200" y="356" width="240" height="14" rx="7" fill="#c9b2de"/>
    <rect x="200" y="400" width="150" height="48" rx="24" fill="url(#accent)"/>
    <rect x="200" y="490" width="280" height="110" rx="18" fill="#eadff6"/>
    <rect x="200" y="630" width="280" height="14" rx="7" fill="#d9c6e8"/>
    <rect x="200" y="658" width="200" height="14" rx="7" fill="#d9c6e8"/>
    <rect x="200" y="690" width="120" height="14" rx="7" fill="#d9c6e8"/>
    <text x="340" y="850" font-size="46" fill="#24185a">Landing</text>

    <!-- Web: varias secciones -->
    <g filter="url(#shadow)">
      <rect x="620" y="150" width="360" height="600" rx="30" fill="#f8f2fd"/>
    </g>
    <rect x="620" y="150" width="360" height="56" rx="30" fill="#eadff6"/>
    <rect x="620" y="178" width="360" height="28" fill="#eadff6"/>
    <circle cx="658" cy="178" r="8" fill="#c9b2de"/><circle cx="684" cy="178" r="8" fill="#c9b2de"/><circle cx="710" cy="178" r="8" fill="#c9b2de"/>
    <rect x="660" y="236" width="60" height="14" rx="7" fill="#24185a"/>
    <rect x="800" y="236" width="40" height="14" rx="7" fill="#c9b2de"/>
    <rect x="852" y="236" width="40" height="14" rx="7" fill="#c9b2de"/>
    <rect x="904" y="236" width="36" height="14" rx="7" fill="#9b6dff"/>
    <rect x="660" y="280" width="280" height="150" rx="18" fill="url(#accent)"/>
    <rect x="690" y="320" width="160" height="18" rx="9" fill="#f1e8fb"/>
    <rect x="690" y="352" width="120" height="12" rx="6" fill="#cdb9f6"/>
    <rect x="660" y="460" width="132" height="120" rx="16" fill="#eadff6"/>
    <rect x="808" y="460" width="132" height="120" rx="16" fill="#eadff6"/>
    <rect x="660" y="606" width="280" height="14" rx="7" fill="#d9c6e8"/>
    <rect x="660" y="634" width="220" height="14" rx="7" fill="#d9c6e8"/>
    <rect x="660" y="680" width="130" height="40" rx="20" fill="none" stroke="#7543d6" stroke-width="4"/>
    <text x="800" y="850" font-size="46" fill="#24185a">Web</text>

    <!-- Tienda: catálogo y carrito -->
    <g filter="url(#shadow)">
      <rect x="1080" y="190" width="360" height="560" rx="30" fill="#f8f2fd"/>
    </g>
    <rect x="1080" y="190" width="360" height="56" rx="30" fill="#eadff6"/>
    <rect x="1080" y="218" width="360" height="28" fill="#eadff6"/>
    <circle cx="1118" cy="218" r="8" fill="#c9b2de"/><circle cx="1144" cy="218" r="8" fill="#c9b2de"/><circle cx="1170" cy="218" r="8" fill="#c9b2de"/>
    <rect x="1120" y="282" width="140" height="18" rx="9" fill="#24185a"/>
    <g fill="none" stroke="#7543d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1352 278h12l10 34h40l8-24h-52"/>
      <circle cx="1380" cy="324" r="5" fill="#7543d6"/><circle cx="1408" cy="324" r="5" fill="#7543d6"/>
    </g>
    <circle cx="1424" cy="274" r="13" fill="url(#accent)"/>
    <g>
      <rect x="1120" y="340" width="132" height="120" rx="16" fill="#e2d3f7"/>
      <rect x="1268" y="340" width="132" height="120" rx="16" fill="#d6c4f6"/>
      <rect x="1120" y="472" width="90" height="12" rx="6" fill="#c9b2de"/>
      <rect x="1120" y="494" width="56" height="14" rx="7" fill="#7543d6"/>
      <rect x="1268" y="472" width="90" height="12" rx="6" fill="#c9b2de"/>
      <rect x="1268" y="494" width="56" height="14" rx="7" fill="#7543d6"/>
      <rect x="1120" y="530" width="132" height="120" rx="16" fill="#d6c4f6"/>
      <rect x="1268" y="530" width="132" height="120" rx="16" fill="#e2d3f7"/>
      <rect x="1120" y="662" width="90" height="12" rx="6" fill="#c9b2de"/>
      <rect x="1120" y="684" width="56" height="14" rx="7" fill="#7543d6"/>
      <rect x="1268" y="662" width="90" height="12" rx="6" fill="#c9b2de"/>
      <rect x="1268" y="684" width="56" height="14" rx="7" fill="#7543d6"/>
    </g>
    <text x="1260" y="850" font-size="46" fill="#24185a">Tienda</text>
  </g>
</svg>
